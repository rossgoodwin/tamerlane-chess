name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Engine, security rules, and two-player online test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt
      # Put the failing tests' output into annotations, which show on the run's summary page.
      - name: Report failures
        if: failure()
        run: |
          python3 - <<'PY'
          import re
          out = open('test-output.txt', encoding='utf-8', errors='replace').read() if __import__('os').path.exists('test-output.txt') else 'no test output'
          def note(title, text):
              text = text[-30000:].replace('%', '%25').replace('\r', '').replace('\n', '%0A')
              print(f'::error title={title}::{text}')
          lines = out.splitlines()
          fails = [i for i, l in enumerate(lines) if re.match(r'\s*not ok \d+', l) and 'tests/' not in l]
          for n, i in enumerate(fails[:8]):
              note(f'Failed test {n + 1}', '\n'.join(lines[i:i + 40]))
          note('Last lines of test output', '\n'.join(lines[-80:]))
          PY

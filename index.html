<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Full Tamerlane Chess</title>
<meta name="description" content="Play the full MS 7322 array of Tamerlane chess (shaṭranj al-kabīr) on one device or by sending links.">
<meta property="og:title" content="Full Tamerlane Chess">
<meta property="og:description" content="Your move in a game of Tamerlane chess, played on the full array of manuscript 7322.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ECECEC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F0F0F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Cousine:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/tour.css">
</head>
<body>
<!--BODY-->
<div class="shell">
  <header class="top">
    <div>
      <div class="eyebrow">Shaṭranj al-kabīr · array of MS 7322</div>
      <h1>Full Tamerlane Chess</h1>
      <div class="sub" id="rulesline"></div>
      <a class="support" href="https://ko-fi.com/rossgoodwin" target="_blank" rel="noopener">Support this project</a>
    </div>
    <div class="seg" role="group" aria-label="Where to play" id="modes"></div>
  </header>
  <div id="banner"></div>
  <div class="layout">
    <section class="play" aria-label="Game">
      <div class="strip" id="strip-top"></div>
      <div class="boardwrap"><div class="board" id="board" role="grid" aria-label="Board"></div></div>
      <div class="strip" id="strip-bottom"></div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="actions" id="actions"></div>
      <div class="toast" id="toast" aria-live="polite"></div>
      <div class="panelbox" id="panel"></div>
    </section>
    <aside class="side" aria-label="Reference">
      <div class="card" id="info"></div>
      <div>
        <div class="tabs" role="tablist" id="tabs"></div>
        <div class="tabpanel" id="tabpanel" role="tabpanel"></div>
      </div>
    </aside>
  </div>
</div>
<div id="sheet"></div>
<!--/BODY-->
<script>window.tfcOnline=new Promise(function(r){window.__tfcOnline=r;});</script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
<script src="js/tour.js"></script>
<script type="module" src="js/online.js"></script>
</body>
</html>
